# =====================================================================
# PaperPilot 配置文件
# 顶会顶刊论文智能追踪系统 —— 采集 / 筛选 / 深度分析 / 报告
# 修改本文件后下次运行 main.py 即生效，无需重启
# =====================================================================

app:
  name: PaperPilot
  timezone: Asia/Shanghai
  lookback_days: 7              # 向前追溯多少天内的论文
  daily_analysis_limit: 10      # 每天最多做多少篇完整 LLM 深度分析
  daily_ingest_limit: 20        # 每天最多新增入库多少篇论文（0=不限制；已入库论文更新不受限）
  ingest_min_relevance: 25      # 入库相关度阈值（0-100）：低于此值的新论文直接丢弃不入库
  ingest_per_topic_limit: 4     # 每个研究领域每天最多入库几篇（0=不限；多主题论文归入最高分主题）
  ingest_wildcard_limit: 2      # 机动名额：每天额外入库「顶会但零关键词命中」的新方向论文（0=关闭）
  request_timeout: 40           # 单次请求超时（秒）
  request_delay: 3              # 同一信源相邻请求间隔（秒），保护对方服务
  max_topic_keywords: 40        # 每个主题关键词数量上限（LLM 提炼回写时防止膨胀）
  max_keyword_tags: 5           # 每篇论文的关键词标签数量上限

sources:
  arxiv:
    enabled: true
    max_results_per_query: 20
    # arXiv 分类：cs.AI/cs.LG/cs.CV/cs.MA/cs.CL/cs.NE/stat.ML/eess.SP
    categories: [cs.AI, cs.LG, cs.CV, cs.MA, cs.CL, cs.NE, stat.ML, eess.SP]
  openalex:
    enabled: true
    max_results_per_venue: 40
    conference_lookback_days: 730   # 会议按"最近一届"拉取（约2年）
    arxiv_lookback_days: 7          # arXiv 预印本兜底窗口
    mailto: ""                  # ★强烈建议填你的邮箱：进入 polite pool，显著减少 429
  crossref:
    enabled: true
    max_results_per_journal: 30
    lookback_days: 90           # 期刊滚动窗口（天）
    mailto: ""                  # 同上，建议填写
  github:
    enabled: true
    max_repos_per_query: 5
    max_repos_total: 40
  openreview:
    enabled: true
    max_results_per_venue: 100   # 每个会议最多拉多少篇（主题匹配后）
    # OpenReview 原生承办的会议（NeurIPS/ICML/ICLR 等）；程序自动探测最近一届年份。
    # CVPR/ICCV/AAAI/KDD/ECCV 不在 OpenReview 上，由 arXiv/OpenAlex 覆盖。
    venues:
      NeurIPS: "NeurIPS.cc"
      ICML: "ICML.cc"
      ICLR: "ICLR.cc"

# ---------------------------------------------------------------------
# 顶会顶刊注册表：openalex_source 为 OpenAlex 的 source id（用于按会议/期刊拉取）
# issn 为 Crossref 期刊 ISSN（用于期刊最新论文）
# 注：OpenAlex 对 ICML/ECCV 收录不全，这两类由 arXiv 分类 + 主题词兜底
# ---------------------------------------------------------------------
venues:
  conferences:
    AAAI: {openalex_source: S4210191458}
    NeurIPS: {openalex_source: S4363606243}
    ICML: {openalex_source: ""}        # OpenAlex 收录不全，靠 arXiv 预印本兜底
    CVPR: {openalex_source: S4210176548}
    ICCV: {openalex_source: S4363607764}
    ECCV: {openalex_source: ""}        # 同上
    KDD: {openalex_source: S4363608767}
  journals:
    TPAMI: {openalex_source: S199944782, issn: "0162-8828"}
    TIP: {openalex_source: S4210173141, issn: "1057-7149"}
    TNNLS: {openalex_source: S4210175523, issn: "2162-237X"}
