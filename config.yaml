# ---------------------------------------------------------------------
# 排序权重：先做关键词相关度评分，再结合 LLM 分析得分做综合排序
# ---------------------------------------------------------------------
ranking:
  title_match_weight: 3.0
  abstract_match_weight: 1.0
  venue_bonus: 3.0            # 命中顶会顶刊时的加分
  min_relevance_score: 15     # 相关度阈值（0-100），低于此值不进入深度分析
  weights:
    relevance: 0.30
    novelty_potential: 0.25
    evidence_quality: 0.20
    transfer_value: 0.15
    reproducibility: 0.10

# ---------------------------------------------------------------------
# 每日三段式定时任务（由 scheduler.py 读取）
#   - 午夜 00:00 采集新论文并入库 Zotero（Action1）
#   - 早上 07:00 每 topic 选一篇未精读论文精读写 Obsidian（Action2）
#   - 晚上 23:00 点评当天笔记 + 生成日报 + 发邮件（Action3+4）
# ---------------------------------------------------------------------
schedule:
  collect_hour: 0
  collect_minute: 0
  read_hour: 7
  read_minute: 0
  review_hour: 23
  review_minute: 0

# ---------------------------------------------------------------------
# 通知（邮件 + 飞书，均需在 .env 填写凭据）
#   邮件需要 SMTP 凭据：SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD / SMTP_TO
#   示例（QQ 邮箱）：SMTP_HOST=smtp.qq.com  SMTP_PORT=465  SMTP_PASSWORD=你的授权码
#   端口 465 走 SSL，587 走 STARTTLS；SMTP_PASSWORD 是「授权码」而非登录密码
# ---------------------------------------------------------------------
notifications:
  email_enabled: true
  feishu_enabled: false

# ---------------------------------------------------------------------
# Zotero 文献管理同步
# 优先尝试本地 API 自动入库；失败/未开启时生成 BibTeX 导入文件
# ---------------------------------------------------------------------
zotero:
  enabled: true
  export_bibtex: true
  bibtex_path: "data/exports/paperpilot_import.bib"
  local_api_url: "http://localhost:23119"   # Zotero 7+ 本地 API
  collection: "PaperPilot/ToRead"            # 建议在 Zotero 里手动建好的集合
  # 说明：Zotero 10 的写权限无需手动配 token —— 程序运行时会调
  # POST /api/local/authorize，Zotero 弹出授权框，你点 Always Allow 即可。

# ---------------------------------------------------------------------
# Obsidian 知识库导出
# vault_path 填你的 Vault 绝对路径；留空则用项目内 obsidian_vault/ 示例
# ---------------------------------------------------------------------
obsidian:
  enabled: true
  vault_path: "C:/Users/pl/ResearchVault"   # 你的 Obsidian Vault（将自动创建目录结构）
  daily_folder: "00-Inbox/PaperPilot-Daily"
  export_top_notes: 10          # 已弃用：已分析/待精读论文现全部写文献卡（幂等），无需限制数量

# ---------------------------------------------------------------------
# IMA 交互导出（人工导入模式）
# ---------------------------------------------------------------------
ima:
  enabled: true
  export_dir: "data/ima_exports"
  export_limit: 20              # 精选论文导出数量上限

